<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="description" content="SysLog: Real-time news dashboard." />
  <meta property="og:title" content="SysLog | Dashboard" />
  <meta property="og:description" content="SysLog: Real-time news dashboard." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#050505" />
  <title>SysLog | Dashboard</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./favicon.png" />
  <link rel="manifest" href="./manifest.json" />

  <link rel="preconnect" href="https://ipapi.co" />
  <link rel="preconnect" href="https://api.open-meteo.com" />
  
  <!-- Configuration -->
  <script src="config.js?v=2"></script>

  <style>
    :root {
      --bg: #050505;
      --panel: #0a0a0a;
      --text: #e8e9ea;
      --dim: #6b7280;
      --border: #1a1a1a;
      --c1: #00e5ff;
      --c2: #39ff14;
      --font: ui-monospace, Menlo, Consolas, monospace;
    }

    /* Light Theme */
    [data-theme="light"] {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --text: #1a1a1a;
      --dim: #6b7280;
      --border: #e5e5e5;
      --c1: #0088cc;
      --c2: #00aa00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    /* TICKER */
    #ticker-container {
      background: #000;
      border-bottom: 2px solid var(--c1);
      overflow: hidden;
      position: sticky;
      top: 61px;
      z-index: 9;
      height: 40px;
      display: flex;
      align-items: center;
    }

    #ticker-label {
      background: var(--c1);
      color: #000;
      padding: 0 16px;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.1em;
      height: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    #ticker-content {
      display: flex;
      align-items: center;
      white-space: nowrap;
      animation: scroll-ticker 900s linear infinite;
      padding-left: 100%;
      will-change: transform;
    }

    .ticker-item {
      padding: 0 40px;
      font-size: 13px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: color 0.2s ease;
      cursor: pointer;
    }

    .ticker-item:hover {
      color: var(--c1);
    }

    .ticker-item::before {
      content: "●";
      color: var(--c1);
      font-size: 8px;
    }

    @keyframes scroll-ticker {
      0% {
        transform: translate3d(0, 0, 0);
      }

      100% {
        transform: translate3d(-50%, 0, 0);
      }
    }

    #ticker-content:hover,
    #ticker-content:focus-within {
      animation-play-state: paused;
    }

    .brand {
      color: var(--c1);
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    #ddg-search {
      display: flex;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    #ddg-search input {
      background: transparent;
      border: none;
      color: white;
      padding: 8px 12px;
      width: 220px;
      outline: none;
    }

    #ddg-search button {
      background: #222;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }

    .weather-button {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
    }

    /* WEATHER */
    :focus-visible {
      outline: 2px solid var(--c1);
      outline-offset: 2px;
    }

    .weather-popup {
      position: fixed;
      right: 20px;
      bottom: 80px;
      background: var(--panel);
      border: 1px solid var(--c1);
      padding: 14px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: 0.2s ease;
      width: 240px;
      max-width: calc(100vw - 40px);
      z-index: 999;
    }

    .weather-popup.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* FEED */
    .feed {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease;
      will-change: transform;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--c1);
    }

    .card:focus {
      outline: 2px solid var(--c1);
      outline-offset: 2px;
    }

    /* Skeleton Loading */
    .skeleton {
      background: linear-gradient(90deg, var(--panel) 25%, #1a1a1a 50%, var(--panel) 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s ease-in-out infinite;
      border-radius: 10px;
    }

    @keyframes skeleton-loading {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    .skeleton-card {
      height: 120px;
      margin-bottom: 16px;
    }

    /* Refresh Indicator */
    .refresh-indicator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--panel);
      border: 1px solid var(--c1);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .refresh-indicator.active {
      opacity: 1;
    }

    .refresh-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--c1);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Keyboard Shortcuts Help */
    .shortcuts-hint {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--dim);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .shortcuts-hint.visible {
      opacity: 1;
    }

    /* Theme Toggle Button */
    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.3s ease;
      margin-left: 10px;
    }

    .theme-toggle:hover {
      border-color: var(--c1);
      transform: scale(1.1);
    }

    /* Scroll to Top Button */
    .scroll-top-btn {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: var(--c1);
      color: #000;
      border: none;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scroll-top-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .scroll-top-btn:hover {
      transform: translateY(-5px);
    }

    /* Search Bar */
    .search-container {
      padding: 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 101px;
      z-index: 8;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--c1);
    }

    .search-input::placeholder {
      color: var(--dim);
    }

    /* Category Filter Chips */
    .filter-chips {
      display: flex;
      gap: 8px;
      padding: 16px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      position: sticky;
      top: 173px;
      z-index: 7;
    }

    .filter-chips::-webkit-scrollbar {
      height: 4px;
    }

    .filter-chips::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .chip {
      padding: 6px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .chip:hover {
      border-color: var(--c1);
    }

    .chip.active {
      background: var(--c1);
      color: #000;
      border-color: var(--c1);
      font-weight: bold;
    }

    /* Read/Unread Indicators */
    .card.read {
      opacity: 0.6;
    }

    .card.read .title {
      color: var(--dim);
    }

    .unread-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 8px;
      height: 8px;
      background: var(--c1);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Share Button */
    .share-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .card:hover .share-btn {
      opacity: 1;
    }

    .share-btn:hover {
      background: var(--c1);
      color: #000;
      border-color: var(--c1);
    }

    /* Reading Time Badge */
    .reading-time {
      font-size: 11px;
      color: var(--dim);
      margin-left: 8px;
    }

    /* Notification Toast */
    .notification-toast {
      position: fixed;
      top: 80px;
      right: 20px;
      background: var(--c1);
      color: #000;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      transform: translateX(400px);
      transition: all 0.4s ease;
      z-index: 101;
      max-width: 300px;
      box-shadow: 0 4px 12px rgba(0, 229, 255, 0.3);
    }

    .notification-toast.show {
      opacity: 1;
      transform: translateX(0);
    }

    /* Improved Grid Layout */
    @media (min-width: 1400px) {
      .feed {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 768px) {
      .feed {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .filter-chips {
        padding: 12px;
      }

      .search-container {
        padding: 12px;
      }
    }

    /* Card Improvements */
    .card {
      position: relative;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--dim);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: color 0.2s ease;
    }

    .action-btn:hover {
      color: var(--c1);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 10px;
    }

    .favicon {
      width: 18px;
      height: 18px;
    }

    .source {
      font-weight: bold;
      color: white;
    }

    .time {
      margin-left: auto;
      font-size: 11px;
      opacity: 0.7;
    }

    .title {
      font-size: 14px;
      line-height: 1.4;
    }

    .status {
      padding: 20px;
      text-align: center;
      color: var(--dim);
    }

    #scroll-sentinel {
      height: 40px;
    }
  </style>
</head>

<body>
  <noscript>
    <div style="padding: 20px; background: #900; color: #fff; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 9999;">
      Please enable JavaScript to view the SysLog dashboard.
    </div>
  </noscript>

  <h1 class="sr-only" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;">SysLog Real-time News Dashboard</h1>

  <!-- TOP BAR -->
  <header id="top-bar">
    <div class="brand" tabindex="0" role="button" aria-label="Refresh and scroll to top" style="cursor:pointer;" onclick="manualRefresh(); window.scrollTo({top:0, behavior:'smooth'});">SysLog</div>

    <div role="search">
      <form id="ddg-search" action="https://duckduckgo.com/" method="GET" target="_blank" rel="noopener noreferrer">
        <input name="q" placeholder="Search..." aria-label="Search query" />
        <button type="submit" aria-label="Submit search">🦆</button>
      </form>
    </div>

    <button class="weather-button" id="weather-btn" aria-label="Toggle Weather">☀️</button>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme">🌙</button>
  </header>

  <!-- SEARCH BAR -->
  <div class="search-container">
    <input type="text" class="search-input" id="search-input" placeholder="Search articles..." aria-label="Search articles">
  </div>

  <!-- CATEGORY FILTERS -->
  <nav class="filter-chips" id="filter-chips" aria-label="Category Filters">
    <button class="chip active" data-category="all">All</button>
    <button class="chip" data-category="tech">Tech</button>
    <button class="chip" data-category="hacker">Hacker</button>
    <button class="chip" data-category="cyber">Cyber</button>
    <button class="chip" data-category="gaming">Gaming</button>
    <button class="chip" data-category="space">Space</button>
    <button class="chip" data-category="science">Science</button>
    <button class="chip" id="mark-all-read" style="margin-left: auto; border-color: var(--c1);">Mark All Read</button>
  </nav>

  <!-- TICKER -->
  <aside id="ticker-container" aria-live="off" aria-label="Sports Ticker">
    <div id="ticker-label">LIVE</div>
    <div id="ticker-content">
      <!-- Ticker items will be populated by JavaScript -->
    </div>
  </aside>

  <!-- WEATHER -->
  <div class="weather-popup" id="weather-popup" role="dialog" aria-label="Weather Information">
    <div id="w-temp">--°F</div>
    <div id="w-condition">Loading...</div>
    <div id="w-loc">...</div>
  </div>

  <!-- REFRESH INDICATOR -->
  <div class="refresh-indicator" id="refresh-indicator" role="status" aria-live="polite">
    <div class="refresh-spinner"></div>
    <span class="refresh-text">Refreshing...</span>
  </div>

  <!-- KEYBOARD SHORTCUTS HINT -->
  <div class="shortcuts-hint" role="tooltip">
    Press <strong>R</strong> to refresh • <strong>Ctrl+↑/↓</strong> to scroll • <strong>T</strong> for theme • <strong>?</strong> for help
  </div>

  <!-- SCROLL TO TOP BUTTON -->
  <button class="scroll-top-btn" id="scroll-top-btn" aria-label="Scroll to top">↑</button>

  <!-- NOTIFICATION TOAST -->
  <div class="notification-toast" id="notification-toast" role="alert" aria-live="assertive"></div>

  <!-- FEED -->
  <main class="feed" id="feed" role="main" aria-label="News Feed">
    <div class="status">Initializing stream...</div>
  </main>

  <div id="scroll-sentinel" aria-hidden="true"></div>

  <script>
    'use strict';

    // Use external config if available, otherwise use defaults
    const CONFIG = typeof SYSLOG_CONFIG !== 'undefined' ? SYSLOG_CONFIG : {
      BATCH_SIZE: 20,
      AUTO_REFRESH_INTERVAL: 5 * 60 * 1000,
      CACHE_TTL: 30 * 60 * 1000,
      RETRY_DELAYS: [1000, 2000, 4000],
      TICKER_SPEED: 40,
      FILTER_GAMBLING: true,
      SPORTS_CATEGORIES: ['nba', 'nfl', 'mlb', 'nhl', 'soccer'],
      SHOW_SHORTCUTS_HINT: true,
      SHORTCUTS_HINT_DELAY: 2000,
      SMOOTH_SCROLL: true,
      SHOW_SKELETON_LOADING: true,
      SKELETON_CARD_COUNT: 6,
      ENABLE_KEYBOARD_SHORTCUTS: true,
      KEYBOARD_SCROLL_DISTANCE: 300,
      TEMPERATURE_UNIT: 'fahrenheit',
      ENABLE_CACHE: true,
      ENABLE_RETRY: true,
      MAX_FEED_ITEMS: 0,
      DEBUG_MODE: false,
    };

    let ITEMS = [];
    let FILTERED_ITEMS = [];
    let index = 0;
    let autoRefreshTimer = null;
    let retryCount = 0;
    let currentCategory = 'all';
    let searchQuery = '';
    let readArticles = new Set(JSON.parse(localStorage.getItem('readArticles') || '[]'));
    let isFetching = false;

    function favicon(url) {
      try {
        return "https://icons.duckduckgo.com/ip3/" + new URL(url).hostname + ".ico";
      } catch {
        return "";
      }
    }

    function fallbackFavicon(img, source) {
      img.onerror = null;
      img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(source)}&background=1a1a1a&color=00e5ff&size=64&bold=true`;
    }

    function timeAgo(ts) {
      const diff = Date.now() - ts * 1000;
      const m = Math.floor(diff / 60000);
      const h = Math.floor(m / 60);
      const d = Math.floor(h / 24);

      if (diff < 0) return "just now";
      if (d > 0) return d + "d ago";
      if (h > 0) return h + "h ago";
      if (m > 0) return m + "m ago";
      return "just now";
    }

    function estimateReadingTime(title) {
      const words = title.split(/\s+/).length;
      const mins = Math.max(1, Math.ceil((words * 10) / 200));
      return mins + " min read";
    }

    function markAsRead(link) {
      readArticles.add(link);
      localStorage.setItem('readArticles', JSON.stringify([...readArticles]));
    }

    function isRead(link) {
      return readArticles.has(link);
    }

    let toastTimer;
    function showNotification(message) {
      const toast = document.getElementById('notification-toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function shareArticle(title, url) {
      try {
        if (navigator.share) {
          navigator.share({ title, url }).catch(() => {});
        } else {
          navigator.clipboard.writeText(url).then(() => {
            showNotification('Link copied to clipboard!');
          });
        }
      } catch {
        showNotification('Sharing not supported on this device.');
      }
    }

    function toggleBookmark(item, btn) {
      try {
        let bookmarks = JSON.parse(localStorage.getItem('bookmarks') || '[]');
        const idx = bookmarks.findIndex(b => b.link === item.link);
        if (idx !== -1) {
          bookmarks.splice(idx, 1);
          btn.textContent = '🔖';
          showNotification('Bookmark removed');
        } else {
          if (bookmarks.length >= 200) {
             showNotification('Bookmark limit reached (200)!');
             return;
          }
          bookmarks.push(item);
          btn.textContent = '✅';
          showNotification('Article bookmarked!');
        }
        localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
      } catch {
        showNotification('Storage error! Clear cache.');
      }
    }

    function filterItems() {
      let filtered = ITEMS;

      // Apply category filter
      if (currentCategory !== 'all') {
        filtered = filtered.filter(item =>
          item.category?.toLowerCase() === currentCategory.toLowerCase()
        );
      }

      // Apply search filter
      if (searchQuery) {
        const query = searchQuery.toLowerCase();
        filtered = filtered.filter(item =>
          item.title.toLowerCase().includes(query) ||
          item.source.toLowerCase().includes(query)
        );
      }

      FILTERED_ITEMS = filtered;
      index = 0;
      document.getElementById("feed").innerHTML = "";
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderBatch();
    }

    function renderBatch() {
      const feed = document.getElementById("feed");

      const slice = FILTERED_ITEMS.slice(index, index + CONFIG.BATCH_SIZE);

      if (slice.length === 0) {
        if (index === 0) {
          feed.innerHTML = '<div class="status">No articles found matching your filters.</div>';
        } else if (!document.getElementById("end-of-feed")) {
          const endMsg = document.createElement("div");
          endMsg.id = "end-of-feed";
          endMsg.className = "status";
          endMsg.textContent = "You've reached the end of the feed.";
          feed.appendChild(endMsg);
        }
        return;
      }

      slice.forEach(item => {
        const card = document.createElement("div");
        card.className = "card" + (isRead(item.link) ? " read" : "");
        card.style.position = "relative";

        const readingTime = estimateReadingTime(item.title);
        const unreadBadge = !isRead(item.link) ? '<div class="unread-badge"></div>' : '';
        const bookmarks = JSON.parse(localStorage.getItem('bookmarks') || '[]');
        const isBookmarked = bookmarks.some(b => b.link === item.link);
        const bookmarkIcon = isBookmarked ? '✅' : '🔖';

        card.innerHTML = `
          ${unreadBadge}
          <div class="card-header">
            <img class="favicon" src="${favicon(item.link)}" alt="${item.source} favicon" loading="lazy" decoding="async" onerror="fallbackFavicon(this, '${item.source}')" />
            <span class="source">${item.source}</span>
            <time class="time" datetime="${new Date(item.timestamp * 1000).toISOString()}" title="${new Date(item.timestamp * 1000).toLocaleString()}">${timeAgo(item.timestamp)}</time>
            <span class="reading-time">• ${readingTime}</span>
          </div>
          <div class="title">${searchQuery ? item.title.replace(new RegExp('(' + searchQuery + ')', 'gi'), '<mark style="background:var(--c1);color:#000">$1</mark>') : item.title}</div>
          <div class="card-footer">
            <div class="card-actions">
              <button class="action-btn share-btn" title="Share" aria-label="Share article">🔗</button>
              <button class="action-btn bookmark-btn" title="Bookmark" aria-label="Bookmark article">${bookmarkIcon}</button>
            </div>
          </div>
        `;

        // Add click handler for main card
        card.addEventListener('click', (e) => {
          if (!e.target.closest('.action-btn')) {
            markAsRead(item.link);
            card.classList.add('read');
            const badge = card.querySelector('.unread-badge');
            if (badge) badge.remove();
            window.open(item.link, '_blank', 'noopener,noreferrer');
          }
        });

        // Action Handlers
        card.querySelector('.share-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          shareArticle(item.title, item.link);
        });

        card.querySelector('.bookmark-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          toggleBookmark(item, e.currentTarget);
        });



        feed.appendChild(card);
      });

      index += CONFIG.BATCH_SIZE;
    }

    function showSkeletonLoading() {
      if (!CONFIG.SHOW_SKELETON_LOADING) return;
      
      const feed = document.getElementById("feed");
      feed.innerHTML = '';
      for (let i = 0; i < CONFIG.SKELETON_CARD_COUNT; i++) {
        const skeleton = document.createElement("div");
        skeleton.className = "skeleton skeleton-card";
        feed.appendChild(skeleton);
      }
    }

    function showRefreshIndicator(message = "Refreshing...") {
      const indicator = document.getElementById("refresh-indicator");
      indicator.querySelector('.refresh-text').textContent = message;
      indicator.classList.add("active");
    }

    function hideRefreshIndicator() {
      const indicator = document.getElementById("refresh-indicator");
      indicator.classList.remove("active");
    }

    function saveToCache(data) {
      if (!CONFIG.ENABLE_CACHE) return;
      
      try {
        const cacheData = {
          timestamp: Date.now(),
          data: data
        };
        localStorage.setItem('newsCache', JSON.stringify(cacheData));
        if (CONFIG.DEBUG_MODE) console.log('Data cached successfully');
      } catch (e) {
        console.warn('Failed to cache data:', e);
      }
    }

    function loadFromCache() {
      if (!CONFIG.ENABLE_CACHE) return null;
      
      try {
        const cached = localStorage.getItem('newsCache');
        if (!cached) return null;

        const cacheData = JSON.parse(cached);
        const age = Date.now() - cacheData.timestamp;

        if (age < CONFIG.CACHE_TTL) {
          if (CONFIG.DEBUG_MODE) console.log('Loaded from cache, age:', Math.floor(age/1000), 'seconds');
          return cacheData.data;
        }

        localStorage.removeItem('newsCache');
        return null;
      } catch (e) {
        console.warn('Failed to load cache:', e);
        return null;
      }
    }

    async function load(showIndicator = false) {
      if (isFetching) return;
      isFetching = true;
      const feed = document.getElementById("feed");
      feed.setAttribute("aria-busy", "true");

      if (showIndicator) {
        showRefreshIndicator();
        if (feed.children.length > 0) feed.style.opacity = '0.4';
      } else {
        showSkeletonLoading();
      }

      try {
        const res = await fetch("./data.json?t=" + Date.now());
        
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();

        const sportsCategories = CONFIG.SPORTS_CATEGORIES || ['nba', 'nfl', 'mlb', 'nhl', 'soccer'];
        ITEMS = (data.items || [])
          .filter(item => !sportsCategories.includes(item.category?.toLowerCase()))
          .sort((a, b) => b.timestamp - a.timestamp);

        feed.style.opacity = '1';
        filterItems();
        
        saveToCache(data);
        retryCount = 0;
        
        if (showIndicator) {
          hideRefreshIndicator();
        }

        scheduleAutoRefresh();
      } catch (e) {
        console.error('Load failed:', e);
        
        // Try cache first
        const cached = loadFromCache();
        if (cached && !showIndicator) {
          const sportsCategories = CONFIG.SPORTS_CATEGORIES || ['nba', 'nfl', 'mlb', 'nhl', 'soccer'];
          ITEMS = (cached.items || [])
            .filter(item => !sportsCategories.includes(item.category?.toLowerCase()))
            .sort((a, b) => b.timestamp - a.timestamp);

          filterItems();
          
          showRefreshIndicator("Using cached data");
          setTimeout(hideRefreshIndicator, 3000);
        } else {
          // Retry with exponential backoff
          if (CONFIG.ENABLE_RETRY && retryCount < CONFIG.RETRY_DELAYS.length) {
            const delay = CONFIG.RETRY_DELAYS[retryCount];
            retryCount++;
            
            if (CONFIG.DEBUG_MODE) console.log(`Retry attempt ${retryCount}, waiting ${delay}ms`);
            showRefreshIndicator(`Retrying in ${delay/1000}s...`);
            setTimeout(() => load(showIndicator), delay);
          } else {
            document.getElementById("feed").innerHTML =
              "<div class='status'>Failed to load data. Please refresh the page.</div>";
            hideRefreshIndicator();
          }
        }
      } finally {
        isFetching = false;
        document.getElementById("feed").setAttribute("aria-busy", "false");
      }
    }

    // Battery Saving Blur-Pause
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && autoRefreshTimer) {
        clearTimeout(autoRefreshTimer);
        autoRefreshTimer = null;
      } else if (!document.hidden && !autoRefreshTimer) {
        scheduleAutoRefresh();
      }
    });

    function scheduleAutoRefresh() {
      if (autoRefreshTimer) {
        clearTimeout(autoRefreshTimer);
      }

      if (CONFIG.AUTO_REFRESH_INTERVAL > 0) {
        autoRefreshTimer = setTimeout(() => {
          if (CONFIG.DEBUG_MODE) console.log('Auto-refreshing feed...');
          load(true);
        }, CONFIG.AUTO_REFRESH_INTERVAL);
      }
    }

    function manualRefresh() {
      if (autoRefreshTimer) {
        clearTimeout(autoRefreshTimer);
      }
      load(true);
    }

    const observer = new IntersectionObserver(e => {
      if (e[0].isIntersecting) renderBatch();
    });

    observer.observe(document.getElementById("scroll-sentinel"));

    // Weather code to description mapping
    const weatherCodes = {
      0: "Clear sky",
      1: "Mainly clear",
      2: "Partly cloudy",
      3: "Overcast",
      45: "Foggy",
      48: "Depositing rime fog",
      51: "Light drizzle",
      53: "Moderate drizzle",
      55: "Dense drizzle",
      61: "Slight rain",
      63: "Moderate rain",
      65: "Heavy rain",
      71: "Slight snow",
      73: "Moderate snow",
      75: "Heavy snow",
      77: "Snow grains",
      80: "Slight rain showers",
      81: "Moderate rain showers",
      82: "Violent rain showers",
      85: "Slight snow showers",
      86: "Heavy snow showers",
      95: "Thunderstorm",
      96: "Thunderstorm with slight hail",
      99: "Thunderstorm with heavy hail"
    };

    const weatherIcons = {
      0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️", 45: "🌫️", 48: "🌫️", 
      51: "🌧️", 53: "🌧️", 55: "🌧️", 61: "🌧️", 63: "🌧️", 65: "🌧️",
      71: "❄️", 73: "❄️", 75: "❄️", 77: "❄️", 80: "🌦️", 81: "🌦️", 
      82: "⛈️", 85: "🌨️", 86: "🌨️", 95: "🌩️", 96: "⛈️", 99: "⛈️"
    };

    // Weather
    document.getElementById("weather-btn").onclick = async () => {
      const pop = document.getElementById("weather-popup");
      pop.classList.toggle("active");
      
      if (!pop.classList.contains("active") || document.getElementById("w-loc").innerText !== "...") return;

      try {
        let geo = null;
        try { geo = JSON.parse(sessionStorage.getItem('syslog_geo')); } catch(e){}
        if (!geo) {
          geo = await fetch("https://ipapi.co/json/").then(r => r.json());
          sessionStorage.setItem('syslog_geo', JSON.stringify(geo));
        }

        const w = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${geo.latitude}&longitude=${geo.longitude}&current_weather=true&temperature_unit=fahrenheit`
        ).then(r => r.json());

        document.getElementById("w-temp").innerText =
          Math.round(w.current_weather.temperature) + "°F";

        const code = w.current_weather.weathercode;
        const icon = weatherIcons[code] || "☁️";
        document.getElementById("w-condition").innerText =
          `${icon} ${weatherCodes[code] || "Unknown"}`;

        document.getElementById("w-loc").innerText =
          geo.city + ", " + geo.region_code;
      } catch {
        document.getElementById("w-condition").innerText = "Unavailable";
        document.getElementById("w-temp").innerText = "--°F";
        document.getElementById("w-loc").innerText = "Unknown";
      }
    };

    // Ticker - loads ONLY sports scores/news from data.json with clickable links
    async function initTicker() {
      const ticker = document.getElementById("ticker-content");

      try {
        const res = await fetch("./data.json?t=" + Date.now());
        const data = await res.json();

        // Use configured sports categories
        const sportsCategories = CONFIG.SPORTS_CATEGORIES;
        const gamblingRegex = /\b(odds|betting|draftkings|fanduel|betmgm|caesars|picks|parlay|wager|bet|bets|sportsbook|moneyline|over\/under|spread)\b/i;
        
        if (!data || !data.items || data.items.length === 0) {
          ticker.innerHTML = '<span class="ticker-item">No updates available</span>'.repeat(3);
          return;
        }

        let sportsItems = data.items
          .filter(item => sportsCategories.includes(item.category?.toLowerCase()));
        
        // Apply gambling filter if enabled
        if (CONFIG.FILTER_GAMBLING) {
          sportsItems = sportsItems.filter(item => !gamblingRegex.test(item.title));
        }

        // If no sports items, show message
        if (sportsItems.length === 0) {
          ticker.innerHTML = '<span class="ticker-item">No sports updates available</span>'.repeat(3);
          return;
        }

        // Duplicate items for seamless loop
        const allItems = [...sportsItems, ...sportsItems];

        ticker.innerHTML = allItems
          .map(item => `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="ticker-item" title="${item.title}">${item.title}</a>`)
          .join("");
        
        // Dynamically set animation duration based on content length and config speed
        const speedMultiplier = (CONFIG.TICKER_SPEED || 40) / 20; // Base: 40s per 20 items
        const duration = Math.max(20, sportsItems.length * speedMultiplier);
        ticker.style.animationDuration = `${duration}s`;

        if (CONFIG.DEBUG_MODE) console.log(`Ticker loaded with ${sportsItems.length} sports items`);
      } catch (e) {
        console.warn('Ticker load failed:', e);
        // Fallback to sample sports items if data.json fails
        ticker.innerHTML = `
          <span class="ticker-item">NBA playoff winners and losers: Knicks overwhelm 76ers</span>
          <span class="ticker-item">2026 NBA playoff bracket: Schedule, matchups with second round underway</span>
          <span class="ticker-item">Jaylen Brown hasn't shared 'frustrations' with Celtics</span>
        `.repeat(2);
      }
    }

    // Keyboard shortcuts
    if (CONFIG.ENABLE_KEYBOARD_SHORTCUTS) {
      document.addEventListener('keydown', (e) => {
        // R key - Refresh
        if (e.key === 'r' || e.key === 'R') {
          if (!e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            manualRefresh();
          }
        }

        // Escape - Close weather popup & clear search
        if (e.key === 'Escape') {
          const popup = document.getElementById("weather-popup");
          if (popup.classList.contains('active')) {
            popup.classList.remove('active');
            document.getElementById("weather-btn").focus();
          }
          const searchInput = document.getElementById('search-input');
          if (searchInput && document.activeElement === searchInput) {
            searchInput.value = '';
            searchQuery = '';
            searchInput.blur();
            filterItems();
          }
        }

        // Arrow Down - Scroll down
        if (e.key === 'ArrowDown' && e.ctrlKey) {
          e.preventDefault();
          window.scrollBy({
            top: CONFIG.KEYBOARD_SCROLL_DISTANCE,
            behavior: CONFIG.SMOOTH_SCROLL ? 'smooth' : 'auto'
          });
        }

        // Arrow Up - Scroll up
        if (e.key === 'ArrowUp' && e.ctrlKey) {
          e.preventDefault();
          window.scrollBy({
            top: -CONFIG.KEYBOARD_SCROLL_DISTANCE,
            behavior: CONFIG.SMOOTH_SCROLL ? 'smooth' : 'auto'
          });
        }

        // ? - Show keyboard shortcuts
        if (e.key === '?') {
          const hint = document.querySelector('.shortcuts-hint');
          hint.classList.toggle('visible');
          setTimeout(() => hint.classList.remove('visible'), 5000);
        }
      });
    }

    // Show shortcuts hint on first load
    if (CONFIG.SHOW_SHORTCUTS_HINT) {
      window.addEventListener('load', () => {
        setTimeout(() => {
          const hint = document.querySelector('.shortcuts-hint');
          hint.classList.add('visible');
          setTimeout(() => hint.classList.remove('visible'), 5000);
        }, CONFIG.SHORTCUTS_HINT_DELAY);
      });
    }

    // Close Weather on Outside Click
    document.addEventListener('click', (e) => {
      const popup = document.getElementById("weather-popup");
      const btn = document.getElementById("weather-btn");
      if (popup && btn && popup.classList.contains('active') && !popup.contains(e.target) && !btn.contains(e.target)) {
        popup.classList.remove('active');
      }
    });

    // Filter Chips
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.category || 'all';
        filterItems();
      });
    });

    // Search Input
    const searchInput = document.getElementById('search-input');
    if (searchInput) {
      let debounceTimer;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          searchQuery = e.target.value;
          filterItems();
        }, 300);
      });
      
      // Fallback to DuckDuckGo search if no local results
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && FILTERED_ITEMS.length === 0 && searchQuery.trim() !== '') {
          window.open(`https://duckduckgo.com/?q=${encodeURIComponent(searchQuery)}`, '_blank');
        }
      });
    }

    // Mark All Read
    const markAllReadBtn = document.getElementById('mark-all-read');
    if (markAllReadBtn) {
      markAllReadBtn.addEventListener('click', () => {
        FILTERED_ITEMS.forEach(item => markAsRead(item.link));
        document.querySelectorAll('.card').forEach(card => {
          card.classList.add('read');
          const badge = card.querySelector('.unread-badge');
          if (badge) badge.remove();
        });
        showNotification('All marked as read!');
      });
    }

    // Theme Toggle
    const themeToggle = document.getElementById('theme-toggle');
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'light') {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          localStorage.setItem('theme', 'light');
        }
      });
      // Restore theme
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    }

    // Scroll to Top
    const scrollTopBtn = document.getElementById('scroll-top-btn');
    if (scrollTopBtn) {
      window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
          scrollTopBtn.classList.add('visible');
        } else {
          scrollTopBtn.classList.remove('visible');
        }
      });
      scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    initTicker();
    load();
  </script>

</body>
