<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SysLog: Real-time news dashboard." />
  <meta name="theme-color" content="#050505" />
  <meta name="robots" content="noindex, nofollow" />
  <title>SysLog | Dashboard</title>

  <link rel="preconnect" href="https://ipapi.co" />
  <link rel="preconnect" href="https://api.open-meteo.com" />

  <style>
    :root {
      --bg: #050505;
      --panel: #0a0a0a;
      --text: #e8e9ea;
      --dim: #6b7280;
      --border: #1a1a1a;
      --c1: #00e5ff;
      --c2: #39ff14;
      --font: ui-monospace, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    /* TICKER */
    #ticker-container {
      background: #000;
      border-bottom: 2px solid var(--c1);
      overflow: hidden;
      position: sticky;
      top: 61px;
      z-index: 9;
      height: 40px;
      display: flex;
      align-items: center;
    }

    #ticker-label {
      background: var(--c1);
      color: #000;
      padding: 0 16px;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.1em;
      height: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    #ticker-content {
      display: flex;
      align-items: center;
      white-space: nowrap;
      animation: scroll-ticker 60s linear infinite;
      padding-left: 100%;
    }

    .ticker-item {
      padding: 0 40px;
      font-size: 13px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .ticker-item::before {
      content: "●";
      color: var(--c1);
      font-size: 8px;
    }

    @keyframes scroll-ticker {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    #ticker-content:hover {
      animation-play-state: paused;
    }

    .brand {
      color: var(--c1);
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    #ddg-search {
      display: flex;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    #ddg-search input {
      background: transparent;
      border: none;
      color: white;
      padding: 8px 12px;
      width: 220px;
      outline: none;
    }

    #ddg-search button {
      background: #222;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }

    .weather-button {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
    }

    /* WEATHER */
    .weather-popup {
      position: fixed;
      right: 20px;
      bottom: 80px;
      background: var(--panel);
      border: 1px solid var(--c1);
      padding: 14px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: 0.2s ease;
      width: 240px;
    }

    .weather-popup.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* FEED */
    .feed {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-decoration: none;
      color: inherit;
      transition: 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--c1);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 10px;
    }

    .favicon {
      width: 18px;
      height: 18px;
    }

    .source {
      font-weight: bold;
      color: white;
    }

    .time {
      margin-left: auto;
      font-size: 11px;
      opacity: 0.7;
    }

    .title {
      font-size: 14px;
      line-height: 1.4;
    }

    .status {
      padding: 20px;
      text-align: center;
      color: var(--dim);
    }

    #scroll-sentinel {
      height: 40px;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <header id="top-bar">
    <div class="brand">SysLog</div>

    <form id="ddg-search" action="https://duckduckgo.com/" method="GET" target="_blank">
      <input name="q" placeholder="Search..." />
      <button>🦆</button>
    </form>

    <button class="weather-button" id="weather-btn">☀️</button>
  </header>

  <!-- TICKER -->
  <div id="ticker-container">
    <div id="ticker-label">LIVE</div>
    <div id="ticker-content">
      <!-- Ticker items will be populated by JavaScript -->
    </div>
  </div>

  <!-- WEATHER -->
  <div class="weather-popup" id="weather-popup">
    <div id="w-temp">--°F</div>
    <div id="w-condition">Loading...</div>
    <div id="w-loc">...</div>
  </div>

  <!-- FEED -->
  <main class="feed" id="feed">
    <div class="status">Initializing stream...</div>
  </main>

  <div id="scroll-sentinel"></div>

  <script>
    'use strict';

    let ITEMS = [];
    let index = 0;
    const BATCH = 12;

    function favicon(url) {
      try {
        return "https://www.google.com/s2/favicons?domain=" + new URL(url).hostname + "&sz=64";
      } catch {
        return "";
      }
    }

    function timeAgo(ts) {
      const diff = Date.now() - ts * 1000;
      const m = Math.floor(diff / 60000);
      const h = Math.floor(m / 60);
      const d = Math.floor(h / 24);

      if (d > 0) return d + "d ago";
      if (h > 0) return h + "h ago";
      if (m > 0) return m + "m ago";
      return "now";
    }

    function renderBatch() {
      const feed = document.getElementById("feed");

      const slice = ITEMS.slice(index, index + BATCH);

      slice.forEach(item => {
        const a = document.createElement("a");
        a.className = "card";
        a.href = item.link;
        a.target = "_blank";

        a.innerHTML = `
          <div class="card-header">
            <img class="favicon" src="${favicon(item.link)}" />
            <span class="source">${item.source}</span>
            <span class="time">${timeAgo(item.timestamp)}</span>
          </div>
          <div class="title">${item.title}</div>
        `;

        feed.appendChild(a);
      });

      index += BATCH;
    }

    async function load() {
      try {
        const res = await fetch("./data.json?t=" + Date.now());
        const data = await res.json();

        ITEMS = (data.items || []).sort((a, b) => b.timestamp - a.timestamp);

        document.getElementById("feed").innerHTML = "";

        renderBatch();
      } catch (e) {
        document.getElementById("feed").innerHTML =
          "<div class='status'>Failed to load data.json</div>";
      }
    }

    const observer = new IntersectionObserver(e => {
      if (e[0].isIntersecting) renderBatch();
    });

    observer.observe(document.getElementById("scroll-sentinel"));

    // Weather code to description mapping
    const weatherCodes = {
      0: "Clear sky",
      1: "Mainly clear",
      2: "Partly cloudy",
      3: "Overcast",
      45: "Foggy",
      48: "Depositing rime fog",
      51: "Light drizzle",
      53: "Moderate drizzle",
      55: "Dense drizzle",
      61: "Slight rain",
      63: "Moderate rain",
      65: "Heavy rain",
      71: "Slight snow",
      73: "Moderate snow",
      75: "Heavy snow",
      77: "Snow grains",
      80: "Slight rain showers",
      81: "Moderate rain showers",
      82: "Violent rain showers",
      85: "Slight snow showers",
      86: "Heavy snow showers",
      95: "Thunderstorm",
      96: "Thunderstorm with slight hail",
      99: "Thunderstorm with heavy hail"
    };

    // Weather
    document.getElementById("weather-btn").onclick = async () => {
      const pop = document.getElementById("weather-popup");
      pop.classList.toggle("active");

      try {
        const geo = await fetch("https://ipapi.co/json/").then(r => r.json());
        const w = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${geo.latitude}&longitude=${geo.longitude}&current_weather=true`
        ).then(r => r.json());

        document.getElementById("w-temp").innerText =
          Math.round(w.current_weather.temperature) + "°F";

        const code = w.current_weather.weathercode;
        document.getElementById("w-condition").innerText =
          weatherCodes[code] || "Unknown";

        document.getElementById("w-loc").innerText =
          geo.city + ", " + geo.region_code;
      } catch {}
    };

    // Ticker - loads sports news from data.json
    async function initTicker() {
      const ticker = document.getElementById("ticker-content");
      
      try {
        const res = await fetch("./data.json?t=" + Date.now());
        const data = await res.json();
        
        // Filter for sports categories (nba, nfl, mlb, etc.)
        const sportsCategories = ['nba', 'nfl', 'mlb', 'nhl', 'soccer'];
        const sportsItems = (data.items || [])
          .filter(item => sportsCategories.includes(item.category?.toLowerCase()))
          .map(item => item.title);
        
        // If no sports items, use all items
        const tickerItems = sportsItems.length > 0 ? sportsItems :
          (data.items || []).map(item => item.title);
        
        // Duplicate items for seamless loop
        const allItems = [...tickerItems, ...tickerItems];
        
        ticker.innerHTML = allItems
          .map(item => `<span class="ticker-item">${item}</span>`)
          .join("");
      } catch (e) {
        // Fallback to sample items if data.json fails
        ticker.innerHTML = `
          <span class="ticker-item">NBA playoff winners and losers: Knicks overwhelm 76ers</span>
          <span class="ticker-item">2026 NBA playoff bracket: Schedule, matchups with second round underway</span>
          <span class="ticker-item">Jaylen Brown hasn't shared 'frustrations' with Celtics</span>
        `.repeat(2);
      }
    }

    initTicker();
    load();
  </script>

</body>
</html>
